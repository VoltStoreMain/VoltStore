name: VoltStore universal inspections
on:
  push:
    branches:
      - feature/voltpassport-v1
      - feature/voltstore-universal-inspections
      - feature/voltguide-ai-assistant
      - feature/voltmarket-unified-flow
  pull_request:
    paths:
      - 'passport-*.js'
      - 'voltpassport.*'
      - 'voltcheck-all.*'
      - 'voltguide*'
      - 'market*'
      - 'passport-app.js'
      - 'index.html'
      - 'netlify/functions/voltguide-ai.mjs'
      - 'tests/*.test.cjs'
      - '.github/workflows/voltpassport.yml'
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check passport-core.js
          node --check passport-app.js
          node --check voltcheck-all.js
          node --check voltguide-core.js
          node --check voltguide.js
          node --check market-core.js
          node --check market.js
          node --check netlify/functions/voltguide-ai.mjs
      - name: Check domain logic and integration structure
        run: node --test tests/*.test.cjs tests/*.test.mjs
