name: VoltStore browser E2E & Lighthouse
on:
  push:
    branches:
      - feature/ci-playwright-lighthouse
      - feature/isolated-demo-build
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.gitignore'
      - 'index.html'
      - 'app.js'
      - 'live.js'
      - 'config.js'
      - 'styles.css'
      - 'supabase/**'
      - 'offline.html'
      - 'e2e/**'
      - 'playwright.config.cjs'
      - 'lighthouserc.cjs'
      - 'package.json'
      - 'market*'
      - 'voltdeal*'
      - 'voltguide*'
      - 'voltcheck-all*'
      - 'voltpassport*'
      - 'passport-*'
      - 'mobile-shell*'
      - 'photo-store.js'
      - 'pwa-client.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - '.github/workflows/ui-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voltstore-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build isolated demo / unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check builder and run domain, integration and isolation tests
        run: |
          node --check scripts/build-preview.mjs
          npm run test:unit
      - name: Build and verify the isolated demo once
        run: |
          npm run build:preview
          npm run verify:preview
      - name: Export the exact demo used by both browser jobs
        uses: actions/upload-artifact@v4
        with:
          name: voltstore-demo-${{ github.run_id }}
          path: preview/
          if-no-files-found: error
          retention-days: 7

  playwright:
    name: Playwright / Chromium + Android emulation + WebKit iPhone
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test tools
        run: npm install --no-audit --no-fund --package-lock=false
      - uses: actions/download-artifact@v4
        with:
          name: voltstore-demo-${{ github.run_id }}
          path: preview/
      - name: Install headless browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run end-to-end browser tests
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Confirm tested files still match the exported artifact
        if: always()
        run: npm run verify:preview
      - name: Save browser screenshots, traces, videos and HTML/JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voltstore-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  lighthouse:
    name: Lighthouse CI / mobile performance & accessibility
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Lighthouse tools
        run: npm install --no-audit --no-fund --package-lock=false
      - uses: actions/download-artifact@v4
        with:
          name: voltstore-demo-${{ github.run_id }}
          path: preview/
      - name: Verify artifact identity before serving
        run: npm run verify:preview
      - name: Measure mobile Lighthouse results and enforce conservative thresholds
        run: npm run test:lighthouse
      - name: Confirm measured files still match the exported artifact
        if: always()
        run: npm run verify:preview
      - name: Archive Lighthouse JSON/HTML reports in GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voltstore-lighthouse-${{ github.run_id }}
          path: |
            .lighthouseci/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
