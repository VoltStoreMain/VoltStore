name: VoltStore universal inspections
on:
  push:
    branches:
      - feature/voltpassport-v1
      - feature/voltstore-universal-inspections
      - feature/voltguide-ai-assistant
      - feature/voltmarket-unified-flow
      - feature/voltdeal-buying-flow
      - feature/mobile-first-marketplace
      - feature/pwa-performance-photos
  pull_request:
    paths:
      - 'passport-*.js'
      - 'voltpassport.*'
      - 'voltcheck-all.*'
      - 'voltguide*'
      - 'market*'
      - 'voltdeal*'
      - 'mobile-shell*'
      - 'pwa-client.js'
      - 'photo-store.js'
      - 'sw.js'
      - 'offline.html'
      - 'manifest.webmanifest'
      - 'icons/*'
      - 'universal-landing.css'
      - 'passport-app.js'
      - 'index.html'
      - 'netlify/functions/voltguide-ai.mjs'
      - 'tests/*.test.cjs'
      - '.github/workflows/voltpassport.yml'
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check passport-core.js
          node --check passport-app.js
          node --check voltcheck-all.js
          node --check voltguide-core.js
          node --check voltguide.js
          node --check market-core.js
          node --check market.js
          node --check voltdeal-core.js
          node --check voltdeal.js
          node --check mobile-shell.js
          node --check pwa-client.js
          node --check photo-store.js
          node --check sw.js
          node --check netlify/functions/voltguide-ai.mjs
      - name: Check domain logic and integration structure
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Assemble static PWA preview
        run: |
          mkdir -p preview/icons
          cp icons/*.png preview/icons/
          for f in index.html styles.css universal-landing.css app.js live.js config.js market.html market.css market-core.js market.js mobile-shell.css mobile-shell.js photo-store.js pwa-client.js manifest.webmanifest sw.js offline.html voltdeal.html voltdeal.css voltdeal-core.js voltdeal.js voltguide.html voltguide.css voltguide-core.js voltguide.js passport-core.js passport-app.js voltpassport.html voltpassport.css voltcheck-all.html voltcheck-all.css voltcheck-all.js voltcheck.html; do
            cp "$f" preview/
          done
      - name: Export tested preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltstore-pwa-preview
          path: preview/
          if-no-files-found: error
          retention-days: 7
